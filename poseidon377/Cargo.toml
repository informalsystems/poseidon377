[package]
name = "poseidon377"
version = "1.2.0"
edition = "2018"
authors = [
    "Penumbra <team@penumbralabs.xyz>",
    "redshiftzero <jen@penumbralabs.xyz>",
]
description = "An instantiation of the Poseidon hash for use with decaf377."
license = "MIT OR Apache-2.0"
repository = "https://github.com/penumbra-zone/poseidon377"

[dependencies]
# decaf377 = { git = "https://github.com/hu55a1n1/decaf377.git" }
cycles-curve-bn254 = { workspace = true }

poseidon-parameters = { workspace = true }
poseidon-permutation = { workspace = true }

ark-ff = { version = "0.6.0", default-features = false, optional = true }
ark-groth16 = { version = "0.6.0", default-features = false, optional = true }
ark-r1cs-std = { version = "0.6.0", default-features = false, optional = true }
ark-relations = { version = "0.6.0", default-features = false, optional = true }
ark-snark = { version = "0.6.0", default-features = false, optional = true }
ark-ec = { version = "0.6.0", default_features = false, optional = true }
ark-std = { version = "0.6.0", default-features = false, optional = true }
ark-serialize = { version = "0.6.0", default_features = false, optional = true }

[features]
default = ["arkworks"]
alloc = []
arkworks = [
    "std",
    "ark-ff/std",
    "ark-groth16/std",
    "ark-r1cs-std/std",
    "ark-relations/std",
    "ark-std/std",
    "ark-ec/std",
    "ark-serialize/std",
]
std = ["alloc"]
r1cs = [
    "arkworks",
    "ark-groth16",
    "ark-relations",
    "ark-snark",
    "ark-r1cs-std",
    "poseidon-permutation/r1cs",
    "ark-std",
    "ark-ec",
    "ark-serialize",
    "cycles-curve-bn254/r1cs"
]
parallel = [
    "ark-ff/parallel",
    "ark-groth16/parallel",
    "ark-r1cs-std/parallel",
    "ark-std/parallel",
    "ark-ec/parallel",
]
u32_backend = []

[dev-dependencies]
serde_json = "1"
